<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduAcademy - Contenido del Curso</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme">

  <nav class="top-nav">
    <a href="index.html" class="brand" style="text-decoration: none; color: white;">← Volver al Catálogo</a>
    <div id="user-display" class="user-pill">Estudiante: Invitado</div>
  </nav>

  <main class="main-layout">
    
    <header class="hero-banner" style="text-align: left;">
      <h1 id="course-title">Cargando Curso...</h1>
      <p id="course-desc">Cargando información del contenido...</p>
    </header>

    <!-- Módulos cargados dinámicamente -->
    <nav id="course-modules" class="category-pills" style="margin-bottom: 1.5rem; justify-content: flex-start; gap: 8px;">
    </nav>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
      
      <!-- Video Embed -->
      <section class="video-container" style="background: #1e293b; padding: 10px; border-radius: 8px;">
        <iframe id="course-video" width="100%" height="400" src="" frameborder="0" allowfullscreen style="border-radius: 6px;"></iframe>
      </section>

      <!-- Recursos -->
      <section style="background: #1e293b; padding: 15px; border-radius: 8px;">
        <h3 style="margin-top: 0; color: #f8fafc;">🖼️ Material Complementario</h3>
        <div id="course-gallery"></div>

        <h3 style="color: #f8fafc; margin-top: 15px;">📄 Recursos Descargables</h3>
        <a id="course-pdf" href="#" target="_blank" class="btn-buy" style="display: block; text-align: center; text-decoration: none; background: #0284c7; width: 100%; box-sizing: border-border-box;">
          📥 Descargar Guía en PDF
        </a>
      </section>

    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
